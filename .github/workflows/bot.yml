name: Telegram Bot Runner

on:
  schedule:
    # Запуск каждые 6 часов (максимальное время работы одного запуска)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Восстанавливаем базу данных из кэша (чтобы помнить старые вопросы)
      - name: Restore SQLite DB
        uses: actions/cache@v4
        with:
          path: questions.db
          key: bot-db-${{ github.run_id }}
          restore-keys: |
            bot-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiosqlite python-dotenv matplotlib fastapi uvicorn

      # Создаем .env файл из секретов
      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "OWNER_IDS=8453857195" >> .env
          echo "WEBAPP_URL=https://slavahri68-crypto.github.io/fernodd_bot_site/" >> .env
          echo "DEFAULT_LANG=ru" >> .env

      # Запускаем бота с таймаутом (чтобы не висел вечно)
      - name: Run Bot
        run: |
          # Запускаем бота в фоне и ждем 5 часов 50 минут (GitHub Actions лимит 6 часов)
          timeout 21000s python -m app.bot || true
        env:
          PYTHONUNBUFFERED: 1
