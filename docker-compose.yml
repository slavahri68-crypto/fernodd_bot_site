# ============================================================
#  docker-compose.yml — AnonBot ULTIMATE
#  Сервисы: db, redis, bot, webapp, nginx, certbot, backup
# ============================================================
version: "3.9"

networks:
  anonbot_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  bot_logs:
  certbot_certs:
  certbot_www:
  backups:

services:

  # ==========================================================
  # PostgreSQL — основная БД
  # ==========================================================
  db:
    image: postgres:16-alpine
    container_name: anonbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botpass}
      POSTGRES_DB: ${POSTGRES_DB:-anonbot}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - anonbot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-anonbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================================
  # Redis — FSM-хранилище и кеш
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: anonbot_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - anonbot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================
  # Бот (aiogram)
  # ==========================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonbot_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-botpass}@db:5432/${POSTGRES_DB:-anonbot}
      REDIS_URL: redis://redis:6379/0
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs
    networks:
      - anonbot_net

  # ==========================================================
  # Mini App (FastAPI)
  # ==========================================================
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: anonbot_webapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-botpass}@db:5432/${POSTGRES_DB:-anonbot}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - anonbot_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================
  # Nginx — HTTPS + реверс-прокси
  # ==========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: anonbot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - webapp
    networks:
      - anonbot_net

  # ==========================================================
  # Certbot — автообновление сертификатов Let's Encrypt
  # ==========================================================
  certbot:
    image: certbot/certbot:latest
    container_name: anonbot_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done
      "
    networks:
      - anonbot_net

  # ==========================================================
  # Автобэкап БД (каждый день в 03:00)
  # ==========================================================
  backup:
    image: postgres:16-alpine
    container_name: anonbot_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-botpass}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bot}
      PGDATABASE: ${POSTGRES_DB:-anonbot}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - anonbot_net