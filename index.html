<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AnonBot Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --bg-2: #1e293b;
    --bg-3: #334155;
    --txt: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --pink: #f472b6;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--txt);
    padding: 16px;
    padding-bottom: 40px;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Шапка ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding: 16px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: var(--radius);
    border: 1px solid var(--bg-3);
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    color: var(--bg);
    flex-shrink: 0;
  }
  .header-info h1 { font-size: 16px; font-weight: 700; }
  .header-info p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ---------- Табы ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 16px;
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: 999px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ---------- Карточки статистики ---------- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent);
  }
  .stat-card.green::before { background: var(--green); }
  .stat-card.yellow::before { background: var(--yellow); }
  .stat-card.pink::before { background: var(--pink); }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  .stat-value { font-size: 26px; font-weight: 800; line-height: 1; }
  .stat-value.small { font-size: 20px; }

  /* ---------- Секции ---------- */
  .section {
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .section h2 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ---------- Вопросы ---------- */
  .q-card {
    background: var(--bg);
    border: 1px solid var(--bg-3);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .q-card:last-child { margin-bottom: 0; }
  .q-meta {
    display: flex; gap: 8px;
    font-size: 11px; color: var(--muted);
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .badge {
    padding: 2px 8px; border-radius: 999px;
    font-weight: 700; font-size: 10px;
  }
  .badge.ok { background: rgba(74,222,128,.15); color: var(--green); }
  .badge.wait { background: rgba(250,204,21,.15); color: var(--yellow); }
  .badge.react { background: rgba(244,114,182,.15); color: var(--pink); }
  .q-text { color: var(--txt); word-break: break-word; }
  .q-answer {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--bg-3);
    color: var(--accent); font-size: 13px;
  }

  /* ---------- Топ ---------- */
  .top-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--bg-3);
  }
  .top-item:last-child { border-bottom: none; }
  .top-rank {
    font-size: 18px; font-weight: 800;
    color: var(--muted); min-width: 28px;
  }
  .top-rank.gold { color: var(--yellow); }
  .top-body { flex: 1; }
  .top-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
  .top-reactions {
    font-size: 12px; color: var(--pink);
    font-weight: 700; white-space: nowrap;
  }

  /* ---------- График ---------- */
  .chart { width: 100%; height: auto; display: block; }

  /* ---------- Утилиты ---------- */
  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 14px; }
  .loading { text-align: center; color: var(--accent); padding: 32px; font-size: 14px; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid var(--bg-3); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .nav-row { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<!-- ============================================================
     ШАПКА
     ============================================================ -->
<div class="header">
  <div class="avatar" id="userAvatar">?</div>
  <div class="header-info">
    <h1 id="userName">Загрузка...</h1>
    <p id="userStatus">—</p>
  </div>
</div>

<!-- ============================================================
     ГЛАВНЫЕ ТАБЫ
     ============================================================ -->
<div class="tabs">
  <div class="tab active" data-tab="overview">📊 Обзор</div>
  <div class="tab" data-tab="questions">💬 Вопросы</div>
  <div class="tab" data-tab="top">🏆 Топ</div>
</div>

<!-- ============================================================
     ТАБ: ОБЗОР
     ============================================================ -->
<div id="tab-overview">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Всего</div>
      <div class="stat-value" id="sTotal">—</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Отвечено</div>
      <div class="stat-value" id="sAnswered">—</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">Ждут</div>
      <div class="stat-value" id="sPending">—</div>
    </div>
    <div class="stat-card pink">
      <div class="stat-label">Сегодня</div>
      <div class="stat-value" id="sToday">—</div>
    </div>
  </div>

  <div class="section">
    <h2>📈 Активность (14 дней)</h2>
    <canvas id="activityChart" class="chart" height="160"></canvas>
  </div>

  <div class="section">
    <h2>👥 Пользователи</h2>
    <div class="stat-value small" id="sUsers">—</div>
  </div>
</div>

<!-- ============================================================
     ТАБ: ВОПРОСЫ
     ============================================================ -->
<div id="tab-questions" class="hidden">
  <div class="tabs" style="margin-bottom:12px">
    <div class="tab active" data-mode="all">Все</div>
    <div class="tab" data-mode="unans">Ждут</div>
  </div>
  <div id="questionsList">
    <div class="loading"><span class="spinner"></span>Загрузка...</div>
  </div>
  <div class="nav-row">
    <button class="tab" id="prevPage" style="flex:1">⬅️ Назад</button>
    <button class="tab" id="nextPage" style="flex:1">Вперёд ➡️</button>
  </div>
</div>

<!-- ============================================================
     ТАБ: ТОП
     ============================================================ -->
<div id="tab-top" class="hidden">
  <div class="section">
    <h2>🏆 Топ по реакциям</h2>
    <div id="topList">
      <div class="loading"><span class="spinner"></span>Загрузка...</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  Telegram WebApp init
// ============================================================
const tg = window.Telegram?.WebApp;
let INIT_DATA = "";

if (tg) {
  tg.ready();
  tg.expand();
  INIT_DATA = tg.initData || "";
  try { tg.setHeaderColor("#0f172a"); } catch (e) {}
  try { tg.setBackgroundColor("#0f172a"); } catch (e) {}
}

// ============================================================
//  API-хелпер
// ============================================================
async function api(path) {
  const res = await fetch(path, {
    headers: { "X-Init-Data": INIT_DATA },
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// ============================================================
//  Утилиты
// ============================================================
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

// ============================================================
//  Пользователь
// ============================================================
async function loadMe() {
  try {
    const me = await api("/api/me");
    const name = [me.first_name, me.last_name].filter(Boolean).join(" ") || "Гость";
    document.getElementById("userName").textContent = name;
    document.getElementById("userAvatar").textContent =
      (me.first_name || "?")[0].toUpperCase();
    document.getElementById("userStatus").textContent =
      me.is_owner ? "👑 Владелец" : (me.username ? "@" + me.username : "Пользователь");
  } catch (e) {
    document.getElementById("userName").textContent = "Ошибка авторизации";
    document.getElementById("userStatus").textContent =
      "Открой Mini App через Telegram";
  }
}

// ============================================================
//  ОБЗОР
// ============================================================
async function loadOverview() {
  try {
    const s = await api("/api/stats");
    document.getElementById("sTotal").textContent = s.total;
    document.getElementById("sAnswered").textContent = s.answered;
    document.getElementById("sPending").textContent = s.pending;
    document.getElementById("sToday").textContent = s.today;
    document.getElementById("sUsers").textContent = s.users;
    await drawActivityChart();
  } catch (e) {
    console.warn("loadOverview:", e);
  }
}

async function drawActivityChart() {
  const data = await api("/api/activity");
  const canvas = document.getElementById("activityChart");
  const ctx = canvas.getContext("2d");

  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 320;
  const H = 160;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const padL = 28, padR = 8, padT = 12, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const maxV = Math.max(1, ...data.counts);

  ctx.clearRect(0, 0, W, H);

  // сетка
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + chartH * (i / 4);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
  }

  // точки
  const stepX = chartW / (data.counts.length - 1 || 1);
  const pts = data.counts.map((v, i) => [
    padL + stepX * i,
    padT + chartH - (v / maxV) * chartH,
  ]);

  // заливка
  const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, "rgba(56,189,248,0.35)");
  grad.addColorStop(1, "rgba(56,189,248,0)");
  ctx.beginPath();
  ctx.moveTo(pts[0][0], padT + chartH);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(pts[pts.length - 1][0], padT + chartH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // линия
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // точки
  pts.forEach((p, i) => {
    if (data.counts[i] === 0) return;
    ctx.beginPath();
    ctx.arc(p[0], p[1], 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#f472b6";
    ctx.fill();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // подписи X
  ctx.fillStyle = "#94a3b8";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  data.days.forEach((d, i) => {
    if (i % 3 !== 0) return;
    const lbl = d.slice(5).replace("-", ".");
    ctx.fillText(lbl, pts[i][0], H - 6);
  });
}

// ============================================================
//  ВОПРОСЫ
// ============================================================
let qPage = 0;
let qMode = "all";

async function loadQuestions() {
  const list = document.getElementById("questionsList");
  list.innerHTML =
    '<div class="loading"><span class="spinner"></span>Загрузка...</div>';
  try {
    const data = await api(`/api/questions?page=${qPage}&mode=${qMode}`);
    if (!data.items.length) {
      list.innerHTML = '<div class="empty">Пусто 🙂</div>';
      return;
    }
    list.innerHTML = data.items.map(q => {
      const badge = q.is_answered
        ? '<span class="badge ok">✅ отвечено</span>'
        : '<span class="badge wait">⏳ ждёт</span>';
      const media = q.media_type
        ? `<span class="badge">📎 ${escapeHtml(q.media_type)}</span>`
        : "";
      const react = q.reactions
        ? `<span class="badge react">${q.reactions}❤️</span>`
        : "";
      const answer = q.answer
        ? `<div class="q-answer">💌 ${escapeHtml(q.answer)}</div>`
        : "";
      return `
        <div class="q-card">
          <div class="q-meta">
            #${q.id} ${badge} ${media} ${react}
          </div>
          <div class="q-text">${escapeHtml(q.question || "(медиа)")}</div>
          ${answer}
        </div>`;
    }).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

document.getElementById("prevPage").onclick = () => {
  if (qPage > 0) { qPage--; loadQuestions(); }
};

document.getElementById("nextPage").onclick = () => {
  qPage++;
  loadQuestions();
};

// фильтр Все / Ждут
document.querySelectorAll('[data-mode]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    qMode = el.dataset.mode;
    qPage = 0;
    loadQuestions();
  };
});

// ============================================================
//  ТОП
// ============================================================
async function loadTop() {
  const list = document.getElementById("topList");
  list.innerHTML =
    '<div class="loading"><span class="spinner"></span>Загрузка...</div>';
  try {
    const data = await api("/api/top");
    if (!data.items.length) {
      list.innerHTML = '<div class="empty">Пока нет реакций 🙂</div>';
      return;
    }
    list.innerHTML = data.items.map((t, i) => {
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
      const rankClass = i === 0 ? "top-rank gold" : "top-rank";
      return `
        <div class="top-item">
          <div class="${rankClass}">${medal}</div>
          <div class="top-body">
            <div class="top-text">#${t.id} · ${escapeHtml(t.question || "(медиа)")}</div>
          </div>
          <div class="top-reactions">${t.reactions}❤️</div>
        </div>`;
    }).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

// ============================================================
//  ПЕРЕКЛЮЧЕНИЕ ТАБОВ
// ============================================================
document.querySelectorAll('[data-tab]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    const tab = el.dataset.tab;
    ["overview", "questions", "top"].forEach(t => {
      document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
    });
    if (tab === "overview") loadOverview();
    if (tab === "questions") loadQuestions();
    if (tab === "top") loadTop();
  };
});

// ============================================================
//  СТАРТ
// ============================================================
(async () => {
  await loadMe();
  await loadOverview();

  // автообновление обзора каждые 30 секунд
  setInterval(() => {
    const ov = document.getElementById("tab-overview");
    if (ov && !ov.classList.contains("hidden")) loadOverview();
  }, 30000);
})();
</script>

</body>
</html>
